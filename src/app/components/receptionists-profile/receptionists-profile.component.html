<body>
    <!-- Sidebar Component-->
    <app-receptionists-sidebar></app-receptionists-sidebar>
    <!-- Header Component-->
    <app-receptionists-header></app-receptionists-header>

    <div class="profile-container">
        <!-- <div class="edit-button" (click)="openEditModal()">

        <div class="profile-header">
          <img [src]="profile.photo" alt="Profile" class="profile-photo" />
          <div class="profile-name">
            <h2>{{ profile.name }}</h2>
            <p>{{ profile.phone }}</p>
          </div>
        </div>
      
        <div class="profile-details">
          <div class="detail-row"><label>Email</label><span>{{ profile.email }}</span></div>
          <div class="detail-row"><label>Phone</label><span>{{ profile.phone }}</span></div>
          <div class="detail-row"><label>Employer ID</label><span><strong>{{ profile.employerId }}</strong></span></div>
          <div class="detail-row"><label>Password</label><span>🔒 {{ profile.password }}</span></div>
          <div class="detail-row"><label>Department</label><span>{{ profile.department }}</span></div>
