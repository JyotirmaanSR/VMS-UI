<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Component-->
        <app-sidebar></app-sidebar>
        <!-- Header Component-->
        <app-header></app-header>
        
        <!-- Main Content -->
        <div class="main-content">
            
            <div class="dashboard-section">
                    <div class="stats-cards">
                        <div class="card"><h3>{{ visitorsExpected }}</h3><p>Visitors Expected</p></div>
                        <div class="card"><h3>{{ completedMeetings }}</h3><p>Completed Meetings</p></div>
                        <div class="card"><h3>{{ defaultedVisitors }}</h3><p>Defaulted Visitors</p></div>
                        <div class="card"><h3>{{ pendingVisits }}</h3><p>Pending Visits</p></div>                        
                    </div>
                
                <div class="visitation-section">
                    <div class="visitation-history">
                        <h4>Visitation history</h4>
                        <button class="invite-btn">+ Create Invite</button>
                        <ag-grid-angular
                            style="width: 100%; height: 300px;"
                            class="ag-theme-alpine"
                            [rowData]="rowData"
                            [columnDefs]="columnDefs"
                            [defaultColDef]="defaultColDef"
                            rowSelection="single">
                        </ag-grid-angular>
                    </div>
                    <div class="side-boxes-container">
                    <div class="recent-visits" style="height: 180px; max-width: 450px;">
                        <h4>Recent Visitation</h4>
                        <div class="visitor-avatars">
                          <ng-container *ngFor="let visitor of visibleVisitors">
                            <img [src]="visitor.imageUrl" alt="Visitor">
                          </ng-container>
                          <span *ngIf="hiddenCount > 0">+{{ hiddenCount }}</span>
                        </div>
                      </div>
                      <div class="notifications">
                        <h3>
                          Notifications <i class="fas fa-bell"></i>
                        </h3>
                        <ul>
                          <li *ngFor="let note of notifications">
                            {{ note.message }} - <span class="time">{{ note.time }}</span>
                          </li>
                        </ul>
                      </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</body>
</html>
