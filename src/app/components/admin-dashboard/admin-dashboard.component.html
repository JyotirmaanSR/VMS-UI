<!-- dashboard.component.html -->
<div class="dashboard">
    
  <!-- Sidebar Component-->
  <app-admin-sidebar></app-admin-sidebar>
  <!-- Header Component-->
  <app-admin-header></app-admin-header>
    <!-- Main Content -->
    <main class="main">
      <!-- <header class="topbar">
        <button class="create-invite">+ Create Invite</button>
        <div class="user-info">
          <span>Andrew</span>
          <small>Admin account</small>
        </div>
      </header> -->
  
      <!-- Stats Section -->
      <div class="stats">
        <div class="stat-card">
          <h3>8</h3>
          <p>Visitors Expected</p>
        </div>
        <div class="stat-card">
          <h3>4</h3>
          <p>Completed Meetings</p>
        </div>
        <div class="stat-card">
          <h3>10</h3>
          <p>Defaulted Visitors</p>
        </div>
        <div class="stat-card">
          <h3>10</h3>
          <p>Pending Visits</p>
        </div>
      </div>
  
      <!-- Content Section -->
      <div class="content">
        <!-- Visitation History using AG Grid -->
        <div class="card visit-history">
          <div class="card-header">
            <h4>Visitation history</h4>
            <button class="invite-btn" (click)="inviteForm.showForm()">+ Add Visitor</button>
            <app-add-visitor-form #inviteForm></app-add-visitor-form>
          </div>
  
          <ag-grid-angular
          style="width: 100%; height: 500px;"
          class="ag-theme-alpine"
          [rowData]="rowData"
         [columnDefs]="columnDefs"
         [pagination]="true"
         [paginationPageSize]="10">
         </ag-grid-angular>
  
        </div>
  
        <!-- Top Staffs Section -->
        <div class="card top-staffs">
          <h4>Top Staffs</h4>
          <div class="avatars">
            <img src="https://randomuser.me/api/portraits/women/1.jpg" />
            <img src="https://randomuser.me/api/portraits/women/2.jpg" />
            <img src="https://randomuser.me/api/portraits/women/3.jpg" />
            <img src="https://randomuser.me/api/portraits/women/4.jpg" />
          </div>
        </div>
      </div>
    </main>
  </div>
