<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor's LogBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    
</head>
<body>
    <!-- Header Component -->
    <app-header></app-header>
    <!-- Sidebar Component -->
    <app-sidebar></app-sidebar>

    <!-- Visitors Logbook -->
    <div class="logbook-container">
        <!-- Filter Sidebar -->
        <div class="filter-sidebar">
          <h4 style="font-size: 20px; font-weight: 700;"><i class="fas fa-filter"></i>  FILTER</h4> <br>
          <ul>
            <li><input type="checkbox" (change)="applyFilter('all')" /> All</li>
            <li><input type="checkbox" (change)="applyFilter('expected')" /> Expected</li>
            <li><input type="checkbox" (change)="applyFilter('checkedIn')" /> Checked in</li>
            <li><input type="checkbox" (change)="applyFilter('checkedOut')" /> Checked out</li>
          </ul>
        </div>
      
        <!-- Main Content -->
        <div class="logbook-content">
          <div class="top-bar">
            <div class="search-box">
              <input type="text" placeholder="Search" [(ngModel)]="searchText" />
              <button (click)="applySearch()">Search</button>
            </div>
      
            <div class="actions">
              <select class="dropdown" [(ngModel)]="selectedDepartment">
                <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
              </select>
      
              <input type="date" class="date-picker" [(ngModel)]="selectedDate" />
            </div>
          </div>
      
          <!-- AG Grid Table -->
          <ag-grid-angular
            class="ag-theme-alpine ag-custom"
            style="width: 100%; max-width: 1100px;"
            [rowData]="filteredData"
            [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef"
            [domLayout]="'autoHeight'"
            [suppressHorizontalScroll]="true">
            </ag-grid-angular>

        </div>
      </div>
      
</body>
</html>
