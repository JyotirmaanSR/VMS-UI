<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reports</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      margin-left: 300px;
      
    }

    .contents{
      margin-top: 80px;
    }

    h2 {
      color: #3b2d85;
      margin-bottom: 20px;
    }

    .filters {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
    }

    .filters input[type="text"],
    .filters input[type="date"] {
      padding: 8px 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .submit-button {
      padding: 10px 16px;
      background-color: #3b2d85;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .submit-button:hover {
      background-color: #2c2271;
    }

    .report-container {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      position: relative;
    }

    .export-button {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #0c746f;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
    }

    /* AG Grid Overrides */
    .ag-theme-alpine {
      --ag-header-background-color: #f5f5f5;
      --ag-row-hover-color: #eef;
      --ag-odd-row-background-color: #fff;
      --ag-font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      --ag-font-size: 14px;
      border-radius: 8px;
      border: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .ag-theme-alpine .ag-header-cell-label {
      font-weight: 600;
      color: #333;
    }
    .ag-theme-alpine .ag-cell {
      padding: 10px;
    }
  </style>
</head>

<body>
  <app-admin-header></app-admin-header>
  <app-admin-sidebar></app-admin-sidebar>
  <div class="contents">
  <h2>Reports</h2>

  <div class="filters">
    <label>
      Name:
      <input type="text" placeholder="Enter efficiency">
    </label>
    <label>
      From:
      <input type="date">
    </label>
    <label>
      To:
      <input type="date">
    </label>
    <button class="submit-button">Submit</button>
  </div>

  <div class="report-container">
    <button class="export-button">📄</button>
    <ag-grid-angular
      style="width: 100%; height: 500px;"
      class="ag-theme-alpine"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [pagination]="true"
      [paginationPageSize]="10">
    </ag-grid-angular>
  </div>
</div>

</body>
</html>
