<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <app-admin-header></app-admin-header>
  <app-admin-sidebar></app-admin-sidebar>
  <div class="container">
    <div class="top-bar">
      <h2>Employee's</h2>
      <button class="create-emp-btn" (click)="openForm()"><i class="fas fa-plus"></i> Create Employee</button>
    </div>
  
    <div class="admin-employ-container">
  <h2>Employee Management</h2>

  <!-- AG Grid Table -->
  <ag-grid-angular
    class="ag-theme-alpine"
    style="width: 100%; height: 500px;"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [frameworkComponents]="frameworkComponents"
    rowSelection="single"
    domLayout="autoHeight">
  </ag-grid-angular>

  <!-- ======= EDIT EMPLOYEE MODAL ======= -->
  <div *ngIf="showEditModal" class="modal-backdrop">
    <div class="modal-content">
      <h3>Edit Employee</h3>
      <form (ngSubmit)="saveEditedEmployee()">
        <div class="form-group">
          <label>Employee ID</label>
          <input type="text" [value]="editData?.id" disabled class="form-control" />
        </div>
        <div class="form-group">
          <label>Name</label>
          <input type="text" [(ngModel)]="editData.name" name="name" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="editData.email" name="email" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" [(ngModel)]="editData.phone" name="phone" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Department</label>
          <input type="text" [(ngModel)]="editData.department" name="department" class="form-control" required />
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" (click)="closeEditModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ======= DELETE CONFIRMATION MODAL ======= -->
  <div *ngIf="showDeleteModal" class="modal-backdrop">
    <div class="modal-content">
      <h3>Confirm Deletion</h3>
      <p>Are you sure you want to delete employee <strong>{{ deleteData?.name }}</strong>?</p>
      <div class="modal-actions">
        <button class="btn btn-danger" (click)="confirmDelete()">Yes</button>
        <button class="btn btn-secondary" (click)="closeDeleteModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

  </div>
  
</body>
</html>
